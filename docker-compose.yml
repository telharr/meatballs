# PZ Control Panel — Docker Compose (Scenario C)
# Usage:
#   cp .env.example .env   # fill ADMIN_* / JWT on public hosts
#   docker compose up -d --build
#   open http://127.0.0.1:8000/

services:
  pz-panel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pz-control-panel
    restart: unless-stopped
    ports:
      - "${PANEL_BIND:-127.0.0.1}:${PANEL_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PANEL_HOST: "0.0.0.0"
      PANEL_PORT: "8000"
      AUTH_DISABLED: "${AUTH_DISABLED:-false}"
      AUTH_LOCAL_BYPASS: "${AUTH_LOCAL_BYPASS:-false}"
    volumes:
      - panel-data:/data
      - panel-mirror:/mirror
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  panel-data:
    name: pz-panel-data
  panel-mirror:
    name: pz-panel-mirror
