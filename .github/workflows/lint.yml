name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks
          sudo luarocks install luacheck

      - name: Lint Lua under src/mods
        run: |
          if find src/mods -name "*.lua" 2>/dev/null | grep -q .; then
            luacheck src/mods/
          else
            echo "No Lua in src/mods — skip"
          fi

  python-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax-check tools
        run: |
          python -m py_compile tools/workshop_downloader.py
          python -m py_compile tools/pack_merger.py
          python -m py_compile tools/uploader.py

      - name: CLI smoke
        run: |
          python tools/pack_merger.py --help
          python tools/uploader.py --help
          python tools/workshop_downloader.py --help
