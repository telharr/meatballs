name: Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install panel dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r panel/requirements.txt

      - name: py_compile panel + tools
        run: |
          python -m compileall -q panel tools
          python -m py_compile run_panel.py
          python -m py_compile tools/workshop_downloader.py
          python -m py_compile tools/pack_merger.py
          python -m py_compile tools/uploader.py
          python -m py_compile tools/mod_catalog.py
          python -m py_compile tools/local_server.py

      - name: Import panel app
        run: |
          python -c "from panel.server import app; assert app.version; print('panel', app.version)"

      - name: CLI smoke
        run: |
          python tools/pack_merger.py --help
          python tools/uploader.py --help
          python tools/workshop_downloader.py --help

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks
          sudo luarocks install luacheck

      - name: Lint Lua under src/mods
        run: |
          if find src/mods -name "*.lua" 2>/dev/null | grep -q .; then
            luacheck src/mods/ || true
          else
            echo "No Lua in src/mods — skip"
          fi
